name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[test]'

      - name: Run tests
        run: pytest -q

      - name: Run linter
        run: ruff check .

      - name: Reject environment files
        shell: bash
        run: |
          if find . -type f -name '.env*' -not -name '.env.example.disabled' -not -path './.git/*' | grep -q .; then
            echo 'Environment files are prohibited in this repository.' >&2
            exit 1
          fi

      - name: Scan tracked content for common secret patterns
        shell: bash
        run: |
          if git grep -n -I -E '(AKIA[0-9A-Z]{16}|-----BEGIN (RSA|EC|OPENSSH|PRIVATE) KEY-----|sk-[A-Za-z0-9]{20,}|gh[pousr]_[A-Za-z0-9_]{20,})' -- . ':!docs/sprints/*'; then
            echo 'Potential credential pattern found in tracked content.' >&2
            exit 1
          fi
